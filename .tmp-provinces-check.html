<!doctype html><div id="game-container" style="width:800px;height:450px"></div><pre id="result">waiting</pre><script src="phaser.min.js"></script><script type="module">
import {game} from './src/main.js';import {LEVEL_CONFIGS} from './src/levels/levelConfigs.js';
let target=4;const reports=[];let finished=false;window.addEventListener('error',e=>document.querySelector('#result').textContent='FAIL '+e.message);
setTimeout(()=>game.scene.start('GameScene',{level:target}),300);
const poll=setInterval(()=>{const s=game.scene.getScene('GameScene');if(!s?.scene.isActive()||s.currentLevel!==target||!s.player?.active||s.province?.id!==LEVEL_CONFIGS[target].province.id)return;const cfg=LEVEL_CONFIGS[target];if(s.map.width!==cfg.width||!s.children.list.some(o=>o.texture?.key==='province-'+s.province.id)||!s.children.list.some(o=>o.texture?.key==='khmer-finish-house')||s.enemies.getLength()!==cfg.enemies.length)throw Error('Province setup mismatch '+target);reports.push({level:target,name:s.province.name,width:s.map.widthInPixels,enemies:s.enemies.getLength(),boxes:[...s.coinBlocks.values()].filter(b=>b.arrowReward).length});document.querySelector('#result').textContent=JSON.stringify(reports);if(target===28){clearInterval(poll);game.scene.start('LevelSelectScene',{page:2});setTimeout(()=>{const select=game.scene.getScene('LevelSelectScene');document.querySelector('#result').textContent=JSON.stringify({loaded:reports.length,levels:reports,selectorActive:select.scene.isActive(),mapNodes:select.children.list.filter(o=>o.type==='Arc'&&o.input).length})},400);return;}target++;game.scene.start('GameScene',{level:target});},70);
</script>
